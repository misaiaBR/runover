name: Android release
on:
  push:
    tags:
      - 'android-v*'
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Read Android version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use android-vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - name: Configure Android upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/upload-keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              output = []
              for char in value:
                  code = ord(char)
                  if char in "\\:=#! ":
                      output.append("\\" + char)
                  elif char == "\t":
                      output.append("\\t")
                  elif char == "\n":
                      output.append("\\n")
                  elif char == "\r":
                      output.append("\\r")
                  elif char == "\f":
                      output.append("\\f")
                  elif code > 0xFF:
                      encoded = char.encode("utf-16-be")
                      output.extend(
                          f"\\u{int.from_bytes(encoded[i:i + 2], 'big'):04x}"
                          for i in range(0, len(encoded), 2)
                      )
                  else:
                      output.append(char)
              return "".join(output)

          values = {
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "../upload-keystore.jks",
          }
          Path("app/android/key.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in values.items()),
              encoding="iso-8859-1",
          )
          PY
      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#android-v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE=https://runover.onrender.com
        working-directory: app
      - name: Publish Android GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: RUNOVER Android v${{ steps.version.outputs.version }}
          body: "APK Android assinado. O deploy Web segue independente pelo Render."
          files: app/build/app/outputs/flutter-apk/app-release.apk
