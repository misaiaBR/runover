name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: runover_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: PYTHONPATH=backend python -m pytest backend/tests/test_password_reset.py backend/tests/test_claim_integrity.py backend/tests/test_badges.py -q
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
        env:
          RUNOVER_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:55432/runover_test
  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install -g newman@6.2.2
      - run: |
          DATABASE_URL=sqlite:///./newman.db SECRET_KEY=ci-newman-secret-key-that-is-long-enough \
            python -m uvicorn app.main:app --port 8000 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
        working-directory: backend
      - run: newman run backend/tests/postman/runover-api.postman_collection.json -e backend/tests/postman/runover-ci.postman_environment.json
      - run: kill $(cat backend/uvicorn.pid) || true
        if: always()
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: >-
          flutter build web --release
          --dart-define=API_BASE=https://runover.onrender.com
          --dart-define=GOOGLE_WEB_CLIENT_ID=346362177621-g8li6h47ic6sot55p68700a0lgpqo01v.apps.googleusercontent.com
          --dart-define=GOOGLE_SERVER_CLIENT_ID=346362177621-g8li6h47ic6sot55p68700a0lgpqo01v.apps.googleusercontent.com
      - run: flutter build apk --release
