name: Docker
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # As imagens base do Dockerfile (python:3.12-slim, debian:bookworm-slim)
      # vêm da Docker Hub e o pull anônimo dos runners compartilha cota e
      # falha em 429. `secrets` não vale em `if` de step, então a presença é
      # medida aqui e só depois decide o login.
      - name: Checar credenciais da Docker Hub
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # GHCR exige nome minúsculo.
          images: ghcr.io/misaiabr/runover
          # latest=false: só a regra explícita da branch padrão gera latest,
          # para uma tag antiga nunca sequestrar a tag móvel.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=ref,event=tag
      # Em PR só valida que o Dockerfile compila (sem push).
      # Em push na main/tag, publica a imagem no GHCR.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    # Dispara o deploy no Render via Deploy Hook após o merge na main.
    # Configure o segredo RENDER_DEPLOY_HOOK (Render → serviço → Settings).
    # Sem o segredo, o job é pulado e o auto-deploy do Blueprint continua valendo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Sem RENDER_DEPLOY_HOOK; mantido o auto-deploy do Blueprint."
            exit 0
          fi
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
