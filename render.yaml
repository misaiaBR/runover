services:
  - type: web
    name: runover
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: "RUNOVER!"
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: PUBLIC_APP_URL
        value: https://runover.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://runover.onrender.com
      - key: API_TIMEOUT_SECONDS
        value: "15"
